version: '3.8'

services:
  # --- Dịch vụ Backend (ĐÃ CĂN CHỈNH) ---
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: spam-backend
    ports:
      - "8000:8000"
    environment:
      # Cấu hình CORS (Phải được set)
      - ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://localhost:5173
    networks:
      - spam-network

  # --- Dịch vụ Frontend (ĐÃ CĂN CHỈNH) ---
  frontend:
    build: ./frontend
    container_name: spam-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - spam-network

# --- Mạng nội bộ (PHẢI NẰM Ở CẤP ĐỘ GỐC) ---
networks:
  spam-network:
    driver: bridge