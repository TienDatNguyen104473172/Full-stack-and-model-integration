services:
  # --- Dịch vụ Backend (FastAPI) ---
  - type: web
    name: backend
    docker:
      dockerfilePath: ./backend/Dockerfile
      dockerContext: .
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://frontend.onrender.com,http://localhost:3000,http://localhost:5173
    plan: free
    region: singapore

  # --- Dịch vụ Frontend (React + Vite) ---
  - type: web
    name: frontend
    docker:
      dockerfilePath: ./frontend/Dockerfile
      dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://backend.onrender.com
    plan: free
    region: singapore
