version: '3.8'

services:
  # --- Dịch vụ Backend (ĐÃ FIX BUILD CONTEXT) ---
  backend:
    build:
      context: .  # Nhìn vào thư mục gốc để tìm models
      dockerfile: ./backend/Dockerfile # Chỉ định đường dẫn tới Dockerfile
    container_name: spam-backend
    ports:
      - "8000:8000"
    environment:
      # Cấu hình CORS (Phải được set)
      - ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://localhost:5173
    networks:
      - spam-network

  # --- Dịch vụ Frontend ---
  frontend:
    build: ./frontend
    container_name: spam-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - spam-network

# --- Mạng nội bộ ---
networks:
  spam-network:
    driver: bridge