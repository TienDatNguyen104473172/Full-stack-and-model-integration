version: '3.8'

services:
  # --- Dịch vụ Backend ---
  backend:
    build: ./backend
    container_name: spam-backend
    ports:
      - "8000:8000"
    environment:
      # Cho phép Frontend gọi API (Lưu ý: Cần thêm cấu hình Production sau này)
      - ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://localhost:5173
    networks:
      - spam-network

  # --- Dịch vụ Frontend ---
  frontend:
    build: ./frontend
    container_name: spam-frontend
    ports:
      - "80:80"  # Ánh xạ cổng 80 của Container ra cổng 80 của máy thật
    depends_on:
      - backend  # Frontend chỉ chạy khi Backend đã khởi động
    networks:
      - spam-network

# --- Mạng nội bộ để 2 thằng nói chuyện với nhau ---
networks:
  spam-network:
    driver: bridge