name: Docker CI/CD (Build & Push)

on:
  push:
    branches:
      - Main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: TienDatNguyen104473172 # <--- THAY BẰNG TÊN NGƯỜI DÙNG CỦA BẠN!
  REPOSITORY_NAME: full-stack-and-model-integration # Tên repo của bạn

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name | lower }}
          # Dùng list format chuẩn cho tags
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # --- BƯỚC 1: BUILD VÀ PUSH BACKEND (ĐÃ CHUYỂN SANG LIST AN TOÀN) ---
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # SỬ DỤNG CÚ PHÁP LIST DỄ HIỂU HƠN CHO TAGS
          tags:
            - ${{ steps.meta.outputs.tags }}-backend
            - ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name | lower }}_backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      # --- BƯỚC 2: BUILD VÀ PUSH FRONTEND (ĐÃ CHUYỂN SANG LIST AN TOÀN) ---
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags:
            - ${{ steps.meta.outputs.tags }}-frontend
            - ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name | lower }}_frontend:latest
          labels: ${{ steps.meta.outputs.labels }}