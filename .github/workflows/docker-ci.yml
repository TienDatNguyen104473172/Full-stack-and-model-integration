name: Docker CI/CD (Build & Push)

on:
  push:
    branches:
      - Main # Tự động chạy mỗi khi có code được đẩy lên nhánh Main

env:
  # Tên Registry (nơi chứa Docker Image, dùng cho Bước 2)
  REGISTRY: ghcr.io
  # Tên người dùng GitHub của bạn (thay bằng tên thật của bạn)
  IMAGE_OWNER: TienDatNguyen104473172
  # Tên dự án Docker 
  REPOSITORY_NAME: Full-stack-and-model-integration

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Kéo code về máy ảo

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          # Đăng nhập vào GitHub Container Registry (dùng Token của GitHub)
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPOSITORY_NAME }}

      - name: Build and Push Docker images (Backend & Frontend)
        uses: docker/build-push-action@v5
        with:
          context: . # Sử dụng docker-compose.yml ở thư mục gốc
          file: docker-compose.yml # File cấu hình Docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Chỉ định image (Backend và Frontend) sẽ được build
          target: |
            backend
            frontend