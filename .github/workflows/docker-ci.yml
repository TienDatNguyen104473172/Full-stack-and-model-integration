name: Docker CI/CD (Build & Push)

on:
  push:
    branches:
      - Main # Tự động chạy mỗi khi có code được đẩy lên nhánh Main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: TienDatNguyen104473172 
  REPOSITORY_NAME: full-stack-and-model-integration

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPOSITORY_NAME }}

      # --- BƯỚC MỚI 1: BUILD VÀ PUSH BACKEND ---
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend # Chỉ định thư mục Context
          file: ./backend/Dockerfile # Chỉ định Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}-backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPOSITORY_NAME }}_backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      # --- BƯỚC MỚI 2: BUILD VÀ PUSH FRONTEND ---
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # Chỉ định thư mục Context
          file: ./frontend/Dockerfile # Chỉ định Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}-frontend
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPOSITORY_NAME }}_frontend:latest
          labels: ${{ steps.meta.outputs.labels }}