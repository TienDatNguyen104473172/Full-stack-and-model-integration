name: Docker CI/CD (Build & Push)

on:
  push:
    branches:
      - Main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: TienDatNguyen104473172 # Tên người dùng GitHub của bạn
  REPOSITORY_NAME: full-stack-and-model-integration 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

  
      # BẮT ĐẦU CÁC BƯỚC CHẠY UNIT TEST (Nếu lỗi, sẽ dừng ở đây)
     

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Đảm bảo dùng Python 3.11 như trong Dockerfile
          python-version: '3.11' 

      - name: Install dependencies for Test
        # Chạy lệnh trong thư mục backend để cài đặt requirements
        working-directory: ./backend 
        run: |
          python -m pip install --upgrade pip
          # Cài đặt các thư viện cần thiết cho FastAPI và Test (pytest, httpx)
          pip install -r requirements.txt pytest httpx 

      - name: Run Pytest
        # Chạy lệnh pytest từ thư mục gốc, nhắm vào thư mục backend/tests/
        run: pytest backend/tests/
        
  
      # KẾT THÚC TEST - BẮT ĐẦU CÁC BƯỚC BUILD (Chỉ chạy khi Test Passed)
    

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}_backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}_frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # --- BƯỚC 1: BUILD VÀ PUSH BACKEND ---
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # --- BƯỚC 2: BUILD VÀ PUSH FRONTEND ---
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}