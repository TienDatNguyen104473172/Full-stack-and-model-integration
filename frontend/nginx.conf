server {
    listen       80;
    server_name  localhost;

    # Serve static files (built SPA)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Frontend routes: fallback to index.html for SPA
    # Dòng này giữ nguyên để React Router hoạt động (F5 không lỗi 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- CÁC PHẦN DƯỚI ĐÂY ĐƯỢC COMMENT ĐỂ CHẠY TRÊN RENDER ---
